# The Xcode project is generated from this file; `Afleet.xcodeproj` is never committed.
# Sources are declared as directories so a later task adds a file under `App/` or
# `AppTests/` without editing this manifest.
name: afleet
options:
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  AfleetCore: { path: AfleetCore }
  ClaudeWire: { path: ClaudeWire }
  FleetKit:   { path: FleetKit }
  Workbench:  { path: Workbench }
  # C6.1's two, both pinned to one immovable point the way `Workbench/Package.swift` pins
  # libghostty. Neither is imported yet: they land in the seam commit so the leaf's fence — which
  # is `App/Timeline/**` and its tests — closes again and no later task has to reopen this file.
  #
  # swift-markdown publishes **no semver tags**, only `swift-DEVELOPMENT-SNAPSHOT-*`, so `exact`
  # has nothing to name and a revision pin is what "pinned exactly" means here. `de3e245b` is the
  # tip of both `release/6.3` and `release/6.3.1` — the same commit — and the 6.3 line is the one
  # matching this repository's Swift 6.3.3.
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    revision: de3e245b6044386b623ecce11d1ccb5fe766e3db
  # The highlighter, chosen for token-level fidelity with the engine's own: it is a Swift port of
  # highlight.js 11.11.1, which is what the terminal renderer highlights with, pinned by its own
  # differential fixtures against that source (child spec §6). MIT, no dependencies, macOS 15+.
  HighlightKit:
    url: https://github.com/PhraseHQ/HighlightKit.git
    exactVersion: 0.2.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
targets:
  Afleet:
    type: application
    platform: macOS
    # Excluding the ownership READMEs is the one thing the directory declaration cannot do on
    # its own: XcodeGen treats a non-source file under `App/` as a bundle resource, and the seven
    # leaf-ownership `README.md` files of contract Y1 would all copy to `Resources/README.md`,
    # which is a hard "multiple commands produce" build failure. Adding a Swift file under `App/`
    # still needs no edit here.
    sources:
      - path: App
        excludes: ["**/README.md"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: afleet
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # C7.6's Q14. The reasoning lives here because `App/Info.plist` is *generated* from this
        # block: XcodeGen rewrites that file whole on every `make generate`, so a comment written
        # into the plist does not survive one build.
        #
        # Both keys are scoped to the Browser panel's web views. `NSAllowsLocalNetworking` permits
        # plain HTTP to loopback and `.local`, which is what root item 26's `http://localhost:8123`
        # is and what ATS otherwise blocks for a host it cannot evaluate.
        # `NSAllowsArbitraryLoadsInWebContent` is the key Apple provides for exactly this shape — a
        # browser panel navigates where the user points it — and it relaxes ATS for `WKWebView`
        # content only, so afleet's own `URLSession` traffic stays under ATS unchanged. Neither key
        # is `NSAllowsArbitraryLoads`, which would relax both.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afleet.app
    dependencies:
      - package: AfleetCore
      - package: ClaudeWire
      - package: FleetKit
      - package: Workbench
      - package: Markdown
        product: Markdown
      - package: HighlightKit
        product: HighlightKit
  AfleetTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies: [{ target: Afleet }]
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Afleet.app/Contents/MacOS/Afleet"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # A test bundle still has to be code-signed, and code signing needs a plist. The
        # app's plist is a contract and is written out; a test bundle's is nobody's, so it
        # is generated rather than committed.
        GENERATE_INFOPLIST_FILE: YES
schemes:
  afleet:
    build:
      targets: { Afleet: all }
    run:
      executable: Afleet
    test:
      targets:
        - AfleetTests
        - package: AfleetCore/AfleetCoreTests
        - package: ClaudeWire/WireFramesTests
        - package: ClaudeWire/WireMCPTests
        - package: ClaudeWire/WireEnvironmentTests
        - package: ClaudeWire/WireDiagnosticsTests
        - package: ClaudeWire/WireTransportTests
        - package: ClaudeWire/ClaudeWireTests
        - package: FleetKit/FleetTimelineTests
        - package: FleetKit/FleetSessionsTests
        - package: Workbench/TerminalCoreTests
        - package: Workbench/EditorCoreTests
        - package: Workbench/LinkRoutingTests
        - package: Workbench/SourceControlCoreTests
        - package: Workbench/PanelHostAPITests
        - package: Workbench/FilesPanelTests
        - package: Workbench/BrowserPanelTests
